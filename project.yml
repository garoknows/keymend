name: Keymend
options:
  bundleIdPrefix: io.github.garoknows
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "4"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  KeymendCore:
    path: Packages/KeymendCore

targets:
  Keymend:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # Icon: App/Resources/AppIcon.icon is compiled by scripts/compile-icon.sh (Xcode 26+)
      # into Generated/Assets.car (light, dark, tinted, clear) and Generated/AppIcon.icns.
      # Without it, the hand-made AppIcon.icns is used.
      - path: App/Resources/Generated/Assets.car
        buildPhase: resources
        optional: true
      - path: App/Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: KeymendCore
    settings:
      base:
        PRODUCT_NAME: Keymend
        PRODUCT_BUNDLE_IDENTIFIER: io.github.garoknows.keymend
        CODE_SIGN_ENTITLEMENTS: App/Keymend.entitlements
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Keymend:
    build:
      targets:
        Keymend: all
    test:
      targets:
        - package: KeymendCore/KeymendCoreTests
    archive:
      config: Release
