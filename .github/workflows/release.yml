name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build, sign, notarize and check the DMG, but publish nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run build
        default: "0.0.0"

# Read-only by default. Only the publish job, which never sees the signing secrets, can write.
permissions:
  contents: read

env:
  # XcodeGen is downloaded at this exact version and checked against this checksum.
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      APP_NAME: Keymend
      # Signing and notarizing turn on automatically when these repository secrets exist.
      # Without them the release is ad hoc signed (first launch needs "Open Anyway").
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Version from tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          # Only a plain version number gets through, so nothing else can reach a shell command.
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Not a valid version number"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The app's own version is numbers only: 1.2.0-beta.1 stamps 1.2.0 into the app.
          echo "bundle=${V%%-*}" >> "$GITHUB_OUTPUT"

      # Everything the job needs is installed here, before the signing key exists on this machine.
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Tests
        timeout-minutes: 10
        run: swift test --package-path Packages/KeymendCore

      - name: Compile the app icon (Icon Composer .icon to Assets.car + fallback .icns)
        run: |
          scripts/compile-icon.sh
          if [ -f App/Resources/Generated/AppIcon.icns ]; then cp App/Resources/Generated/AppIcon.icns App/Resources/AppIcon.icns; fi

      - name: Generate the Xcode project
        run: |
          xcodegen --version
          xcodegen generate

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          sed "s/YOURTEAMID/$TEAM_ID/" Config/Signing.xcconfig.example > Config/Signing.xcconfig

      - name: Build (Release)
        env:
          BUNDLE: ${{ steps.v.outputs.bundle }}
        run: |
          xcodebuild -project Keymend.xcodeproj -scheme Keymend \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build.nosync/dd MARKETING_VERSION="$BUNDLE" build
          mkdir -p dist
          ditto "build.nosync/dd/Build/Products/Release/$APP_NAME.app" "dist/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "dist/$APP_NAME.app"
          test -f "dist/$APP_NAME.app/Contents/Resources/Assets.car"
          scripts/check-privacy.sh "dist/$APP_NAME.app"

      - name: Write App Store Connect API key
        if: env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Notarize and staple the app
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "dist/$APP_NAME.app" "$RUNNER_TEMP/notarize-app.zip"
          scripts/notarize.sh "$RUNNER_TEMP/notarize-app.zip" "dist/$APP_NAME.app"

      - name: Package DMG
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          scripts/make-dmg.sh "dist/$APP_NAME.app" "dist/Keymend-$VERSION.dmg"
          if [ "$HAS_SIGNING" = "true" ]; then
            codesign --sign "Developer ID Application" --timestamp "dist/Keymend-$VERSION.dmg"
          fi

      - name: Notarize and staple the DMG
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          scripts/notarize.sh "dist/Keymend-$VERSION.dmg"

      - name: Verify Developer ID signature and notarization
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          codesign -dv --verbose=2 "dist/$APP_NAME.app" 2>&1 | grep -E "^Authority|^TeamIdentifier|flags="
          codesign -dv --verbose=2 "dist/Keymend-$VERSION.dmg" 2>&1 | grep -E "^Authority"
          spctl --assess --type execute --verbose=2 "dist/$APP_NAME.app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/Keymend-$VERSION.dmg"
          xcrun stapler validate "dist/$APP_NAME.app"
          xcrun stapler validate "dist/Keymend-$VERSION.dmg"

      - name: Checksums
        run: (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload the DMG for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || rm -f "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" Config/Signing.xcconfig

  publish:
    # A manual run is a dry run: it builds and checks, and never publishes.
    if: github.event_name == 'push'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the DMG from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Publish GitHub release (skipped if the release already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as published."
            exit 0
          fi
          # Notes that open with "**Pre-release" publish as a pre-release, never as the latest version.
          PRERELEASE=""
          if head -n 1 docs/RELEASE_NOTES.md | grep -q '^\*\*Pre-release'; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt $PRERELEASE \
            --title "Keymend $VERSION" --notes-file docs/RELEASE_NOTES.md
