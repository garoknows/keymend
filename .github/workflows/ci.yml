name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the secret scan needs the commits a pull request adds

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit and harness tests (KeymendCore)
        run: swift test --package-path Packages/KeymendCore

      - name: Compile the app icon (Icon Composer .icon to Assets.car + fallback .icns)
        run: |
          scripts/compile-icon.sh
          if [ -f App/Resources/Generated/AppIcon.icns ]; then cp App/Resources/Generated/AppIcon.icns App/Resources/AppIcon.icns; fi

      - name: Generate the Xcode project from project.yml
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (Release, ad hoc signed)
        run: |
          xcodebuild -project Keymend.xcodeproj -scheme Keymend \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build.nosync/dd build

      - name: Check the built app carries the icon variants
        run: |
          R=build.nosync/dd/Build/Products/Release/Keymend.app/Contents/Resources
          ls -la "$R"
          test -f "$R/Assets.car" && test -f "$R/AppIcon.icns"
          xcrun assetutil --info "$R/Assets.car" | grep '"Appearance"' | sort | uniq -c

      - name: Privacy checks (sandbox on, no network, no file writes, no third-party code)
        run: scripts/check-privacy.sh build.nosync/dd/Build/Products/Release/Keymend.app

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
