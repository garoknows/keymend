name: Spell diagnostic (temporary)

# Measures when Apple's spell service returns no completions. Delete once that's understood.
on:
  push:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build the probe
        run: |
          mkdir -p "$RUNNER_TEMP/d"
          cat > "$RUNNER_TEMP/d/main.swift" <<'SWIFT'
          import Foundation
          let mode = CommandLine.arguments[1]
          let words = ["hel", "wor", "som", "thi", "bec", "pla", "gre", "unt"]
          func ms(_ s: Date) -> Int { Int(Date().timeIntervalSince(s) * 1000) }
          var empties = 0, total = 0, firstEmpty = false, firstMs = 0, maxMs = 0
          func record(_ out: [String], _ start: Date) {
              let t = ms(start)
              if total == 0 { firstEmpty = out.isEmpty; firstMs = t }
              total += 1; if out.isEmpty { empties += 1 }; maxMs = max(maxMs, t)
          }
          switch mode {
          case "first-call":
              let c = AppleSpellChecker()
              let s = Date(); record(c.completions(for: "hel"), s)
          case "after-verdict":
              let c = AppleSpellChecker()
              _ = c.verdict(for: "teh")
              let s = Date(); record(c.completions(for: "hel"), s)
          case "series":
              let c = AppleSpellChecker()
              for w in words { let s = Date(); record(c.completions(for: w), s) }
          case "app-like-50ms":
              let c = TimeLimitedSpellChecker(AppleSpellChecker())
              for w in words { let s = Date(); record(c.completions(for: w), s) }
          case "app-like-50ms-after-verdict":
              let c = TimeLimitedSpellChecker(AppleSpellChecker())
              _ = c.verdict(for: "teh")
              for w in words { let s = Date(); record(c.completions(for: w), s) }
          case "parallel-instances":
              let lock = NSLock(); let g = DispatchGroup()
              for _ in 0..<8 {
                  g.enter()
                  Thread.detachNewThread {
                      let c = AppleSpellChecker()
                      for w in words {
                          _ = c.verdict(for: "teh")
                          let s = Date(); let out = c.completions(for: w)
                          lock.lock(); record(out, s); lock.unlock()
                      }
                      g.leave()
                  }
              }
              g.wait()
          default: exit(2)
          }
          print("\(mode) empty=\(empties)/\(total) firstEmpty=\(firstEmpty) firstMs=\(firstMs) maxMs=\(maxMs)")
          SWIFT
          swiftc -swift-version 5 Packages/KeymendCore/Sources/KeymendCore/*.swift "$RUNNER_TEMP/d/main.swift" -o "$RUNNER_TEMP/d/probe"

      - name: Measure, 20 fresh processes per condition
        timeout-minutes: 15
        run: |
          set +e
          for mode in first-call after-verdict series app-like-50ms app-like-50ms-after-verdict parallel-instances; do
            for i in $(seq 1 20); do
              perl -e 'alarm shift; exec @ARGV or die' 30 "$RUNNER_TEMP/d/probe" "$mode" || echo "$mode exit=$?"
            done
          done
